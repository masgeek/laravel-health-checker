name: TODO
on:
  push:
    branches:
      - develop
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  build:
    runs-on: ubuntu-24.04
    concurrency:
      cancel-in-progress: true
      group: todo-${{ github.ref }}
    steps:
      - uses: actions/checkout@v5.1.0
      - name: Run tdg-github-action
        uses: ribtoks/tdg-github-action@v0.4.17-beta
        with:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          LABEL: "todo-tasks"
